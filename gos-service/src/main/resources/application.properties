server.port=8082
spring.application.name=gos-service
# Perfil activo vía entorno: -Dspring.profiles.active=dev|prod (no fijar aquí)

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jackson.time-zone=Europe/Madrid
spring.jackson.locale=es_ES

# Integración Notifica (valores por defecto; sobreescritos por perfil)
notifica.modo=mock
notifica.cod-dir3=
notifica.procedimiento-sia=

# Seguridad JWT
jwt.secret=change-me-in-production
jwt.enabled=false

# Sincronización programada (desactivada por defecto)
notifica.sync-scheduled=false
notifica.sync-interval-ms=300000
notifica.sync-usuario=SISTEMA
notifica.ws-url=

inside.soap.inside-ws-url=https://se-e-inside.redsara.es/inside/services/InsideWSService
inside.soap.ginside-ws-url=https://se-e-inside.redsara.es/inside/services/GInsideWSService
inside.soap.punto-remision-ws-url=https://se-e-inside.redsara.es/inside/services/PuntoRemisionWebService
inside.soap.dry-run=false
inside.registrar-pendiente-on-close=true
inside.auto-envio-on-close=false

# mTLS REDSARA (activar cuando se disponga de certificado)
inside.soap.mtls.enabled=false
inside.soap.mtls.keystore-path=
inside.soap.mtls.keystore-password=
inside.soap.mtls.keystore-type=PKCS12
inside.soap.mtls.truststore-path=
inside.soap.mtls.truststore-password=
inside.soap.mtls.truststore-type=PKCS12

archive.soap.ws-url=https://se-archive.redsara.es/archive/services/soap/ArchiveMtomSecurityWebService
archive.soap.dry-run=false
archive.soap.id-aplicacion=
archive.soap.centro-archivo=
archive.registrar-pendiente-on-close=true
archive.auto-envio-on-close=false

# Metadatos eEMGDE por defecto mientras no exista Serie Documental real asociada al expediente
archive.soap.metadata.clasificacion-default=
archive.soap.metadata.origen-default=Administracion
archive.soap.metadata.estado-elaboracion-default=EE01
archive.soap.metadata.tipo-documental-default=TD99

# mTLS REDSARA (activar cuando se disponga de certificado)
archive.soap.mtls.enabled=false
archive.soap.mtls.keystore-path=
archive.soap.mtls.keystore-password=
archive.soap.mtls.keystore-type=PKCS12
archive.soap.mtls.truststore-path=
archive.soap.mtls.truststore-password=
archive.soap.mtls.truststore-type=PKCS12
