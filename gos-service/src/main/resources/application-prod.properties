# Perfil producción — activar con: spring.profiles.active=prod
# Credenciales vía variables de entorno

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

notifica.modo=${NOTIFICA_MODO:real}
notifica.cod-dir3=${NOTIFICA_COD_DIR3:}
notifica.procedimiento-sia=${NOTIFICA_PROCEDIMIENTO_SIA:}

jwt.secret=${JWT_SECRET}
jwt.enabled=true
